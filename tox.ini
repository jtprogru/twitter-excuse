[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[tox]
isolated_build = True
envlist = py310,py311,py312,py313

[testenv]
deps =
    coverage
    flake8
    mccabe
    mypy
    pylint
    pytest
commands =
    flake8 twtrexcs
    pylint --disable=C0305 twtrexcs
    mypy twtrexcs
    coverage erase
    coverage run --include=twtrexcs/* -m pytest -ra
    coverage report -m
    coverage xml
