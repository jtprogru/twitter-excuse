[tool.poetry]
name = "twtrexcs"
version = "2021.1.0"
description = "We write random excuse in Twitter"
authors = ["Michael Savin <jtprogru@gmail.com>"]
license = "WTFPL"
repository = "https://github.com/jtprogru/twitter-excuse"
homepage = "https://github.com/jtprogru/twitter-excuse"
readme = "README.md"
packages = [{ include = "twtrexcs" }]

[tool.poetry.dependencies]
python = "^3.10"
twitter = "^1.19.6"

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.3.2"
coverage = "^7.15"
flake8 = "^7.3"
flake8-colors = "^0.1.9"
pytest = "^9.0.3"
mccabe = "^0.7.0"
mypy = "^2.3"
pylint = "^4.0"
tox = "^4.59"
tox-gh-actions = "^3.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/jtprogru/twitter-excuse/issues"

[tool.poetry.scripts]
twit = 'twtrexcs:main'
